<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="能力网络">
  <title>能力网络</title>
  <!-- 平台自有品牌图标（2026-09-19）。
       取「枢纽 / hub」意象：中心节点 + 三条辐条 + 三个外环节点。
       配色取自平台自己的 token：ink #0f1c33 作底、accent-2 #38d6d0 作节点。
       刻意避开原 DeepSeek 的品牌蓝 #4D6BFE，避免"看起来还是别人家的图标"。
       同时兼作 favicon 与 portal 顶栏图标（.logo 的 border-radius 与 rx 对齐）。
       ⚠️ 本注释内不得出现两个连续 ASCII 连字符：XML 注释语法不允许，会导致整份 SVG 解析失败
          （即浏览器静默不显示图标）。CSS 变量写法（双连字符加名字）正是最容易踩的形态。 -->
  <rect width="32" height="32" rx="8" fill="#0f1c33"/>
  <g stroke="#38d6d0" stroke-width="2" stroke-linecap="round">
    <path d="M16 16V8"/>
    <path d="M16 16l7 4.5"/>
    <path d="M16 16l-7 4.5"/>
  </g>
  <circle cx="16" cy="16" r="3.5" fill="#ffffff"/>
  <circle cx="16" cy="8" r="2.5" fill="#38d6d0"/>
  <circle cx="23" cy="20.5" r="2.5" fill="#38d6d0"/>
  <circle cx="9" cy="20.5" r="2.5" fill="#38d6d0"/>
</svg>
